name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  sync-to-website:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Checkout technically-speaking-website
        uses: actions/checkout@v4
        with:
          repository: techspeaking777/technically-speaking-website
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          path: website
      - name: Copy build into website repo
        run: |
          rm -rf website/public/tools/3d-cad
          mkdir -p website/public/tools/3d-cad
          cp -r dist/. website/public/tools/3d-cad/
      - name: Commit and push if changed
        working-directory: website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/tools/3d-cad
          if git diff --cached --quiet; then
            echo "No changes to sync"
          else
            git commit -m "chore: sync Retro CAD 3D build from techspeaking777/3DCAD@${GITHUB_SHA}"
            git push
          fi
